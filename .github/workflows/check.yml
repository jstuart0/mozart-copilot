name: check

# Hardened per the campaign plan's Phase 1 (step 7): push(main) + pull_request
# only — deliberately never the "_target" variant of the pull_request trigger,
# which would run untrusted PR code with access to repo secrets. Every action
# below is pinned to a full commit SHA with the version in a trailing comment
# (verified live against GitHub's API on 2026-09-01), never a mutable tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Phase P4: pin the runner to a dated image, never the mutable
    # ubuntu-latest — a silent image bump must not be able to change what the
    # gate tests. The interpreter is pinned via the matrix below: '3.9' is the
    # declared floor (and must keep being exercised) and '3.11' the upper rail.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Phase P4: pin the interpreter by full commit SHA (never a mutable tag),
      # matrix-driven so both the 3.9 floor and 3.11 are exercised.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # Phase P4 (M9): the frontmatter validator's PyYAML cross-check silently
      # skips when PyYAML is not importable (see check_agents.py's
      # yaml_crosscheck_mode_note). Install it at a pinned version, then prove
      # by POSITIVE CONTENT — not by exit code, which stays 0 whether or not
      # the cross-check ran — that the cross-check actually executed. Without
      # this assertion, CI would be green while the 690c789 hotfix is inert.
      - name: PyYAML present so the frontmatter cross-check runs (Phase P4 — M9)
        run: |
          python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.2'
          python3 scripts/check_agents.py --self-test --forms 2>&1 | grep -q 'frontmatter cross-check'

      - name: Parse — check_agents.py and apply_models.py compile
        run: python3 -m py_compile scripts/check_agents.py scripts/apply_models.py

      - name: Parse — shell scripts have valid syntax
        run: bash -n scripts/mozart-lint.sh scripts/mozart-metrics.sh

      - name: No personal-infrastructure fingerprints (Phase P3 — C1 drift-guard)
        run: bash scripts/check-fingerprints.sh

      - name: Validator self-test (fixture corpus)
        run: python3 scripts/check_agents.py --self-test --forms

      - name: Roster floor (raised to 22 in Phase 5 — step 25)
        run: python3 scripts/check_agents.py --min-agents 22

      - name: Manual carve is total (Phase 5 — step 21)
        run: python3 scripts/check_agents.py --check-carve tests/coverage-map.tsv

      - name: Runtime-reads manifest is fresh and resolves in-repo (Phase 5 — step 22; re-added Phase 6 now model-map.jsonc exists)
        run: python3 scripts/check_agents.py --check-doc-refs

      - name: Install-check — fresh repo-scope install passes (Phase 1 — step 4)
        run: |
          T="$(mktemp -d)"
          bash scripts/install-bundle.sh --target "$T" --apply
          python3 scripts/check_agents.py --check-install "$T" --layout repo

      - name: Install-check — fresh user-scope install passes (Phase 2 — step 10)
        run: |
          H="$(mktemp -d)"
          B="$(mktemp -d)"
          bash scripts/install-bundle.sh --user-scope --home "$H" --bin-dir "$B" --apply
          python3 scripts/check_agents.py --check-install "$H/.copilot" --layout user

      - name: Install-check — mid-install failure leaves the documented recovery state (reconciliation r1, codex #1)
        # The bundle is written before agents/wrapper (install-bundle.sh's
        # header documents the exact ordering guarantee, not a rollback).
        # Simulate a write failure after the bundle succeeds by making the
        # agents directory unwritable first, and assert the documented
        # partial state: bundle present, agents absent, nonzero exit.
        run: |
          H="$(mktemp -d)"
          B="$(mktemp -d)"
          mkdir -p "$H/.copilot/agents"
          chmod 0555 "$H/.copilot/agents"
          set +e
          bash scripts/install-bundle.sh --user-scope --home "$H" --bin-dir "$B" --apply
          rc=$?
          set -e
          chmod 0755 "$H/.copilot/agents"
          if [ "$rc" -eq 0 ]; then
            echo "expected a nonzero exit from the simulated write failure" >&2
            exit 1
          fi
          if [ ! -f "$H/.copilot/mozart/VERSION" ]; then
            echo "bundle should already be installed — it's written before agents" >&2
            exit 1
          fi
          if [ -f "$H/.copilot/agents/mozart.agent.md" ]; then
            echo "agents should not have been written past the permission failure" >&2
            exit 1
          fi

      - name: Install-check — absurd-root blocklist resists bypass forms (reconciliation r1, codex #2)
        # Two bypasses the pre-reconciliation blocklist missed: (a) --home
        # pointed at a test fixture while --copilot-home names the REAL
        # ambient $HOME, which the old check compared against the
        # overridden $HOME_DIR and never caught; (b) a '/usr/..'-shaped
        # path, which the old check's literal string compare never
        # resolved to '/'. Both must now be refused (usage error, exit 2).
        run: |
          set +e
          bash scripts/install-bundle.sh --user-scope --home "$(mktemp -d)" --copilot-home "$HOME" --bin-dir "$(mktemp -d)" --apply
          rc1=$?
          bash scripts/install-bundle.sh --user-scope --home "$(mktemp -d)" --copilot-home "/usr/.." --bin-dir "$(mktemp -d)" --apply
          rc2=$?
          set -e
          if [ "$rc1" -ne 2 ]; then
            echo "expected exit 2 refusing --copilot-home \"\$HOME\", got $rc1" >&2
            exit 1
          fi
          if [ "$rc2" -ne 2 ]; then
            echo "expected exit 2 refusing --copilot-home '/usr/..', got $rc2" >&2
            exit 1
          fi

      - name: Model map covers the roster and the allowlist (Phase 6 — step 30)
        run: python3 scripts/check_agents.py --map .github/mozart/config/model-map.jsonc --min-agents 22

      - name: Model stamp has no drift from the canonical map (Phase 6 — step 30)
        run: python3 scripts/apply_models.py --check

      - name: Cross-family invariant holds (Phase 6 — step 30, D8)
        run: python3 scripts/apply_models.py --check-families

      - name: Upstream tiers preserved (Phase 6 — step 30)
        run: python3 scripts/apply_models.py --check-tiers

      - name: Every shipped preset is valid (Phase 6 — step 30)
        # apply_models.py --apply never runs in CI — presets are validated
        # read-only via --validate-map, never stamped onto the working tree.
        run: |
          for m in config/model-maps/*.jsonc; do
            python3 scripts/apply_models.py --validate-map "$m" --check-families --check-tiers || exit 1
          done

      # ------------------------------------------------------------------
      # Phase P10 (D-G): wire the negative map fixtures into CI through BOTH
      # entry points (check_agents.py --map and apply_models.py --validate-map).
      # Every step uses the W7b idiom — capture stdout+status once, assert the
      # exit is *exactly* 1 (never a bare `! cmd`, which would also pass on the
      # `2` that cmd_map:736 returns for a missing map file), then assert a
      # required error substring. For the structural single-defect fixtures the
      # FAIL count is pinned so a future regeneration cannot silently degrade to
      # a no-op — D-G's load-bearing point: map-orphan-role.jsonc used to exit 1
      # on ~20 unrelated coverage errors, so an exit-code-only step proved
      # nothing. The output is captured with `out=$(cmd) && rc=0 || rc=$?` and
      # grepped from the variable, never piped live (a pipe discards the
      # command's status, W7b).
      # ------------------------------------------------------------------
      - name: Map fixture — orphan role fails via both entry points, exactly 1 FAIL (Phase P10, D-G)
        run: |
          out=$(python3 scripts/check_agents.py --map tests/fixtures/map-orphan-role.jsonc --min-agents 22 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "check_agents --map: expected exit 1, got $rc — $out" >&2; exit 1; fi
          n=$(printf '%s\n' "$out" | grep -c '^FAIL')
          if [ "$n" -ne 1 ]; then echo "check_agents --map: expected exactly 1 FAIL, got $n — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF 'orphan role' || { echo "check_agents --map: missing 'orphan role' — $out" >&2; exit 1; }
          out=$(python3 scripts/apply_models.py --validate-map tests/fixtures/map-orphan-role.jsonc 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "validate-map: expected exit 1, got $rc — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF 'orphan role' || { echo "validate-map: missing 'orphan role' — $out" >&2; exit 1; }

      - name: Map fixture — map entry without agent file fails via both entry points, exactly 1 FAIL (Phase P10, D-G)
        run: |
          out=$(python3 scripts/check_agents.py --map tests/fixtures/map-unassigned-file.jsonc --min-agents 22 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "check_agents --map: expected exit 1, got $rc — $out" >&2; exit 1; fi
          n=$(printf '%s\n' "$out" | grep -c '^FAIL')
          if [ "$n" -ne 1 ]; then echo "check_agents --map: expected exactly 1 FAIL, got $n — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF 'phantom-agent' || { echo "check_agents --map: missing 'phantom-agent' — $out" >&2; exit 1; }
          out=$(python3 scripts/apply_models.py --validate-map tests/fixtures/map-unassigned-file.jsonc 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "validate-map: expected exit 1, got $rc — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF 'phantom-agent' || { echo "validate-map: missing 'phantom-agent' — $out" >&2; exit 1; }

      - name: Map fixture — agent file without map entry fails via both entry points, exactly 1 FAIL (Phase P10)
        run: |
          out=$(python3 scripts/check_agents.py --map tests/fixtures/map-uncovered-agent.jsonc --min-agents 22 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "check_agents --map: expected exit 1, got $rc — $out" >&2; exit 1; fi
          n=$(printf '%s\n' "$out" | grep -c '^FAIL')
          if [ "$n" -ne 1 ]; then echo "check_agents --map: expected exactly 1 FAIL, got $n — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF 'has no entry in the map' || { echo "check_agents --map: missing substring — $out" >&2; exit 1; }
          out=$(python3 scripts/apply_models.py --validate-map tests/fixtures/map-uncovered-agent.jsonc 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "validate-map: expected exit 1, got $rc — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF 'has no entry in the map' || { echo "validate-map: missing substring — $out" >&2; exit 1; }

      - name: Map fixture — undefined role fails via both entry points, exactly 1 FAIL (Phase P10)
        run: |
          out=$(python3 scripts/check_agents.py --map tests/fixtures/map-undefined-role.jsonc --min-agents 22 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "check_agents --map: expected exit 1, got $rc — $out" >&2; exit 1; fi
          n=$(printf '%s\n' "$out" | grep -c '^FAIL')
          if [ "$n" -ne 1 ]; then echo "check_agents --map: expected exactly 1 FAIL, got $n — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF "undefined role 'ghost-role'" || { echo "check_agents --map: missing substring — $out" >&2; exit 1; }
          out=$(python3 scripts/apply_models.py --validate-map tests/fixtures/map-undefined-role.jsonc 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "validate-map: expected exit 1, got $rc — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF "undefined role 'ghost-role'" || { echo "validate-map: missing substring — $out" >&2; exit 1; }

      - name: Map fixture — roster-floor violation via --agents-dir (Phase P10; check_agents.py --map only, --min-agents has no --validate-map counterpart)
        run: |
          out=$(python3 scripts/check_agents.py --map tests/fixtures/map-roster-floor.jsonc --agents-dir tests/fixtures/roster-floor-agents --min-agents 22 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "expected exit 1, got $rc — $out" >&2; exit 1; fi
          n=$(printf '%s\n' "$out" | grep -c '^FAIL')
          if [ "$n" -ne 1 ]; then echo "expected exactly 1 FAIL, got $n — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF -- '--min-agents requires >= 22' || { echo "missing roster-floor substring — $out" >&2; exit 1; }

      - name: Map fixture — silent retier is caught by --check-tiers (Phase P10; apply_models.py-only modifier)
        run: |
          out=$(python3 scripts/apply_models.py --validate-map tests/fixtures/map-retiered.jsonc --check-tiers 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "expected exit 1, got $rc — $out" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -qF 'silent upgrade' || { echo "missing 'silent upgrade' — $out" >&2; exit 1; }

      - name: Map fixture — same-family validation is caught by --check-families, exactly one D8 line (Phase P10; apply_models.py-only modifier)
        run: |
          out=$(python3 scripts/apply_models.py --validate-map tests/fixtures/same-family.jsonc --check-families 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then echo "expected exit 1, got $rc — $out" >&2; exit 1; fi
          n=$(printf '%s\n' "$out" | grep -c 'D8 violation')
          if [ "$n" -ne 1 ]; then echo "expected exactly 1 'D8 violation' line, got $n — $out" >&2; exit 1; fi

      - name: Every shipped preset validates structurally (Phase P10)
        # The plan's prose says "five presets"; the shipped set is currently TWO
        # (claude-bulk, gpt-bulk). The glob is the authority, not the prose —
        # this loops over whatever config/model-maps/*.jsonc actually ships, so
        # it neither hard-codes a count nor silently passes on an empty glob
        # (an empty config/model-maps/ would make the loop a no-op, but the
        # stricter --check-families/--check-tiers step above already fails
        # closed on that). Complements that stricter step with a plain
        # structural pass, matching the phase's Automated item verbatim.
        run: |
          for m in config/model-maps/*.jsonc; do
            python3 scripts/apply_models.py --validate-map "$m" || exit 1
          done

      - name: Lint fixture — clean campaign is clean
        run: bash scripts/mozart-lint.sh tests/fixtures/campaign/clean

      - name: Lint fixture — drifted-counterpoint is caught
        # Asserts exit code 1 specifically, not merely non-zero — exit 2
        # ("nothing to lint") must never read as a caught drift.
        run: |
          bash scripts/mozart-lint.sh tests/fixtures/campaign/drifted-counterpoint && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "expected exit 1 (drift detected), got $rc" >&2
            exit 1
          fi

      - name: Lint fixture — drifted-codex-legacy is caught
        run: |
          bash scripts/mozart-lint.sh tests/fixtures/campaign/drifted-codex-legacy && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "expected exit 1 (drift detected), got $rc" >&2
            exit 1
          fi

      - name: Metrics smoke
        run: bash scripts/mozart-metrics.sh tests/fixtures/campaign/clean
